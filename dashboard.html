<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onze Herinneringen – Dashboard</title>
  <link rel="stylesheet" href="styles/shared.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="window.location.href='./index.html'"><span class="back-btn-arrow">← </span>Terug</button>
      <span class="topbar-title">Onze Herinneringen</span>
    </div>
    <div class="topbar-right">
      <div class="user-menu">
        <button class="user-badge" id="userBadge" onclick="toggleUserMenu()">👤 ...</button>
        <div class="user-dropdown" id="userDropdown">
          <button onclick="doLogout()">Uitloggen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <h1>Tijdlijn</h1>
      <p>Hier staan onze gedeelde herinneringen. Klik op een herinnering om hem te bekijken.</p>
    </div>

    <button class="add-btn" onclick="openAddModal()">+ Herinnering toevoegen</button>

    <div class="timeline-section">
      <button class="timeline-arrow prev" id="timelinePrev" onclick="scrollTimeline(-1)">&#8592;</button>
      <button class="timeline-arrow next" id="timelineNext" onclick="scrollTimeline(1)">&#8594;</button>
      <div class="timeline-nav">
        <div class="timeline-scroll" id="timelineScroll">
          <div class="timeline-track" id="timelineTrack"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail modal -->
  <div id="detailModal">
    <div class="detail-box">
      <button class="detail-close" onclick="closeDetail()">✕</button>
      <div class="detail-meta">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-date-loc">
          <span class="detail-chip" id="detailDate"></span>
          <span class="detail-chip" id="detailLocation"></span>
        </div>
      </div>
      <div class="detail-desc" id="detailDesc"></div>

      <!-- No photos placeholder -->
      <div class="no-photos-placeholder" id="noPhotosPlaceholder" style="display:none">
        <p>Geen afbeeldingen toegevoegd aan deze herinnering.</p>
        <button class="no-photos-add-btn" onclick="openEditModal(); setTimeout(()=>document.getElementById('addPhotosInput').click(),300)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Foto's &amp; video's toevoegen
        </button>
      </div>

      <!-- Large viewer -->
      <div class="detail-viewer">
        <button class="viewer-arrow prev" id="viewerPrev" onclick="viewerStep(-1)">&#8592;</button>
        <img id="viewerImg" src="" alt="" />
        <video id="viewerVideo" controls></video>
        <button class="viewer-arrow next" id="viewerNext" onclick="viewerStep(1)">&#8594;</button>
        <div class="viewer-counter" id="viewerCounter"></div>
      </div>

      <!-- Thumbnail strip -->
      <div class="detail-thumbs-wrap">
        <div class="detail-thumbs" id="detailThumbs"></div>
      </div>

      <!-- All photos overview grid -->
      <div class="detail-all-heading">Alle media</div>
      <div class="detail-all-grid" id="detailAllPhotos"></div>

      <!-- Bottom bar: created-by left, edit right -->
      <div class="detail-edit-btn">
        <span class="detail-created-by" id="detailCreatedBy"></span>
        <button onclick="openEditModal()">✏️ Bewerken</button>
      </div>
    </div>
  </div>

  <!-- Add memory modal -->
  <div id="addModal">
    <div class="add-box">
      <button class="detail-close" onclick="closeAddModal()">✕</button>
      <h2 id="addModalTitle">✨ Herinnering toevoegen</h2>
      <div class="form-error" id="addError"></div>

      <div class="form-group">
        <label for="addTitle">Titel *</label>
        <input type="text" class="form-input" id="addTitle" placeholder="bijv. Dagje Amsterdam" maxlength="80" oninput="markDirty()" />
      </div>

      <div class="form-group">
        <label>Datum *</label>
        <div class="date-type-toggle">
          <button class="date-type-btn active" onclick="setDateType('day')">Specifieke dag</button>
          <button class="date-type-btn" onclick="setDateType('month')">Maand &amp; jaar</button>
        </div>
        <input type="date" class="form-input" id="addDateDay" oninput="markDirty()" />
        <input type="month" class="form-input" id="addDateMonth" style="display:none" oninput="markDirty()" />
      </div>

      <div class="form-group">
        <label for="addLocation">Locatie *</label>
        <input type="text" class="form-input" id="addLocation" placeholder="bijv. Amsterdam, Nederland" maxlength="80" oninput="markDirty()" />
      </div>

      <div class="form-group">
        <label for="addFormDesc">Beschrijving <span class="optional">(optioneel)</span></label>
        <textarea class="form-input" id="addFormDesc" rows="3" placeholder="Vertel iets over deze herinnering..." oninput="markDirty()"></textarea>
      </div>

      <div class="form-group">
        <label>Foto's &amp; video's <span class="optional">(optioneel)</span></label>
        <div class="photo-upload-area" onclick="document.getElementById('addPhotosInput').click()">
          <input type="file" id="addPhotosInput" multiple accept="image/*,video/*" onchange="handleFiles(this)" style="display:none" />
          📷 Klik om foto's of video's te selecteren
        </div>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <div class="form-actions">
        <button class="btn-delete" id="deleteMemBtn" onclick="confirmDeleteMemory()" style="display:none"><span class="btn-delete-icon">🗑 </span>Verwijderen</button>
        <button class="btn-cancel" onclick="closeAddModal()">Annuleren</button>
        <button class="btn-submit" id="addSubmitBtn" onclick="submitMemory()">Opslaan ✓</button>
      </div>
    </div>
  </div>

  <!-- Mini Player -->
  <div id="miniPlayer">
    <div id="progressWrap"><div id="progressBar"></div></div>
    <img id="albumArt" src="" alt="" />
    <div id="trackInfo">
      <div id="trackName">Laden...</div>
      <div id="artistName">Onze Blend</div>
    </div>
    <div class="player-controls">
      <button class="ctrl-btn" onclick="skipPrev()">⏮</button>
      <button class="ctrl-btn" id="playPauseBtn" onclick="togglePlay()">⏸</button>
      <button class="ctrl-btn" onclick="skipNext()">⏭</button>
    </div>
  </div>

  <footer style="text-align:center; padding: 0 24px 96px; color: var(--text-muted); font-size: 0.85rem;">
    Gemaakt met veel <span style="color: var(--primary-dark);">♥</span> voor jou
  </footer>

  <div id="toast"></div>

  <script>
    // ── Session guard ──
    const session = JSON.parse(localStorage.getItem('app_session') || 'null');
    if (!session || Date.now() - session.loginAt > 30 * 24 * 60 * 60 * 1000) {
      window.location.replace('./index.html');
    } else {
      // welcomeName element removed from HTML
      document.getElementById('userBadge').textContent   = '👤 ' + session.name;
    }

    function doLogout() {
      localStorage.removeItem('app_session');
      window.location.href = './index.html';
    }
    function toggleUserMenu() {
      document.getElementById('userDropdown').classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const menu = document.getElementById('userDropdown');
      const badge = document.getElementById('userBadge');
      if (!badge.contains(e.target) && !menu.contains(e.target))
        menu.classList.remove('open');
    });

    // ══════════════════════════════════════════
    // FIREBASE
    // ══════════════════════════════════════════
    const firebaseConfig = {
      apiKey:            "AIzaSyDfLpYTRYxM3FAIiRoBUe21TZ7-vS0K1jg",
      authDomain:        "herinneringen-webapp.firebaseapp.com",
      projectId:         "herinneringen-webapp",
      storageBucket:     "herinneringen-webapp.firebasestorage.app",
      messagingSenderId: "331175860752",
      appId:             "1:331175860752:web:794ee8ae902e3a971e0895"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── Cloudflare R2 (video upload via Worker) ──
    const R2_WORKER_URL   = 'https://video-upload.amy-bannink.workers.dev';
    const R2_UPLOAD_TOKEN = 'HerinneringenTim!';

    function captureVideoThumb(file) {
      return new Promise(resolve => {
        const video = document.createElement('video');
        video.muted   = true;
        video.preload = 'metadata';
        const src = URL.createObjectURL(file);
        video.src = src;
        const cleanup = () => URL.revokeObjectURL(src);

        video.addEventListener('loadeddata', () => { video.currentTime = 1; });
        video.addEventListener('seeked', () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width  = 320;
            canvas.height = Math.round(video.videoHeight * 320 / Math.max(video.videoWidth, 1));
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            cleanup();
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          } catch { cleanup(); resolve(null); }
        });
        video.addEventListener('error', () => { cleanup(); resolve(null); });
        setTimeout(() => { cleanup(); resolve(null); }, 4000);
      });
    }

    async function uploadToR2(file, onProgress) {
      const CHUNK = 5 * 1024 * 1024; // 5 MB per stuk (R2 minimum)
      const headers = (extra = {}) => ({
        'X-Upload-Token': R2_UPLOAD_TOKEN,
        ...extra,
      });

      // 1. Start multipart upload
      const initRes = await fetch(`${R2_WORKER_URL}/init`, {
        method: 'POST',
        headers: headers({ 'Content-Type': file.type || 'video/mp4', 'X-File-Name': file.name }),
      });
      if (!initRes.ok) throw new Error(`Init mislukt: ${await initRes.text()}`);
      const { uploadId, key } = await initRes.json();

      // 2. Upload stukken
      const totalChunks = Math.ceil(file.size / CHUNK);
      const parts = [];
      for (let i = 0; i < totalChunks; i++) {
        const chunk    = file.slice(i * CHUNK, Math.min((i + 1) * CHUNK, file.size));
        const partRes  = await fetch(`${R2_WORKER_URL}/part`, {
          method: 'POST',
          headers: headers({
            'Content-Type':   file.type || 'video/mp4',
            'X-Upload-Id':    uploadId,
            'X-Key':          key,
            'X-Part-Number':  String(i + 1),
          }),
          body: chunk,
        });
        if (!partRes.ok) throw new Error(`Stuk ${i + 1} mislukt: ${await partRes.text()}`);
        const { etag } = await partRes.json();
        parts.push({ partNumber: i + 1, etag });
        if (onProgress) onProgress(Math.round(((i + 1) / totalChunks) * 100));
      }

      // 3. Afronden
      const completeRes = await fetch(`${R2_WORKER_URL}/complete`, {
        method: 'POST',
        headers: headers({
          'Content-Type': 'application/json',
          'X-Upload-Id':  uploadId,
          'X-Key':        key,
        }),
        body: JSON.stringify(parts),
      });
      if (!completeRes.ok) throw new Error(`Afronden mislukt: ${await completeRes.text()}`);
      return (await completeRes.json()).url;
    }

    function isVideo(item) { return item && typeof item === 'object' && item.type === 'video'; }
    function videoThumb(item) { return (item && item.thumb) || ''; }

    // Save or update a memory in Firestore
    // Foto's worden opgeslagen in aparte 'memory_images' documenten (1 per foto, volledige kwaliteit)
    async function saveMemoryToFirestore(memData, firestoreId = null) {
      const meta = {
        title:       memData.title,
        date:        memData.date,
        sortDate:    memData.sortDate,
        dateType:    memData.dateType || 'day',
        location:    memData.location,
        description: memData.description || null,
        updatedBy:   session.name,
        updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
      };

      if (firestoreId) {
        // Update metadata
        await db.collection('memories').doc(firestoreId).update(meta);
        // Verwijder oude foto's en sla nieuwe op
        const oldImgs = await db.collection('memory_images')
          .where('memoryId', '==', firestoreId).get();
        const batch = db.batch();
        oldImgs.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
      } else {
        meta.createdBy = session.name;
        meta.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        const ref = await db.collection('memories').add(meta);
        firestoreId = ref.id;
      }

      // Sla elke foto/video op als apart document
      for (let i = 0; i < memData.images.length; i++) {
        const item = memData.images[i];
        const doc  = isVideo(item)
          ? { memoryId: firestoreId, type: 'video', url: item.url, thumb: item.thumb || null, order: i }
          : { memoryId: firestoreId, type: 'image', data: item, order: i };
        await db.collection('memory_images').add(doc);
      }

      return firestoreId;
    }

    // Laad alle memories + foto's uit Firestore, sla op in localStorage cache
    async function syncFromFirestore() {
      try {
        const [memoriesSnap, imagesSnap] = await Promise.all([
          db.collection('memories').get(),
          db.collection('memory_images').get()
        ]);

        // Groepeer foto's per memoryId
        const imagesByMemory = {};
        imagesSnap.docs.forEach(doc => {
          const d = doc.data();
          if (!imagesByMemory[d.memoryId]) imagesByMemory[d.memoryId] = [];
          imagesByMemory[d.memoryId].push(d);
        });
        Object.values(imagesByMemory).forEach(imgs =>
          imgs.sort((a, b) => a.order - b.order)
        );

        const fbMems = memoriesSnap.docs.map(docSnap => ({
          id:          'fb_' + docSnap.id,
          firestoreId: docSnap.id,
          ...docSnap.data(),
          images: (imagesByMemory[docSnap.id] || []).map(i =>
            i.type === 'video' ? { type: 'video', url: i.url, thumb: i.thumb || null } : (i.data || i)
          )
        }));

        memoriesCache = fbMems;
        saveCache();
        renderTimeline();
      } catch(e) {
        console.warn('Firestore sync mislukt:', e);
      }
    }

    // Verwijder memory + alle bijbehorende foto's uit Firestore
    async function deleteFromFirestore(firestoreId) {
      const imagesSnap = await db.collection('memory_images')
        .where('memoryId', '==', firestoreId).get();
      const batch = db.batch();
      imagesSnap.docs.forEach(d => batch.delete(d.ref));
      batch.delete(db.collection('memories').doc(firestoreId));
      await batch.commit();

      memoriesCache = memoriesCache.filter(m => m.firestoreId !== firestoreId);
      saveCache();
    }

    // ══════════════════════════════════════════
    // TIMELINE RENDERER
    // ══════════════════════════════════════════
    let tlOffset = 0;

    // In-memory cache — localStorage is only used as a fast initial load.
    // We never rely on localStorage.setItem succeeding (it fails when Base64
    // images fill the ~5 MB quota), so the in-memory array is always authoritative.
    let memoriesCache = (() => {
      try { return JSON.parse(localStorage.getItem('fb_memories') || '[]'); } catch { return []; }
    })();

    function saveCache() {
      try { localStorage.setItem('fb_memories', JSON.stringify(memoriesCache)); } catch {}
    }

    function isMobile() { return window.innerWidth < 768; }

    function getAllMemories() {
      return [...memoriesCache].sort((a, b) => a.sortDate.localeCompare(b.sortDate));
    }

    function renderTimeline() {
      const track = document.getElementById('timelineTrack');
      track.innerHTML = '';
      tlOffset = 0;
      track.style.transform = 'translateX(0)';

      const mobile  = isMobile();
      const allMems = getAllMemories();
      // Desktop: oldest → newest (left → right)
      // Mobile: newest → oldest (top → bottom)
      const ordered = mobile ? [...allMems].reverse() : [...allMems];

      ordered.forEach(mem => {
        // Determine above/below based on sorted index (stable alternating)
        const origIdx = allMems.indexOf(mem);
        const isAbove = origIdx % 2 === 0; // 0,2,4 = above | 1,3,5 = below

        const item = document.createElement('div');
        item.className = `memory-item ${isAbove ? 'above' : 'below'}`;
        item.onclick   = () => openDetail(mem);

        if (!mobile) {
          // ── Desktop: three-zone column ──
          const fanClass = isAbove ? '' : 'flipped';
          const fanHtml  = buildFan(mem.images, fanClass);
          const lblHtml  = buildLabel(mem);

          item.innerHTML = `
            <div class="item-top">
              ${isAbove ? fanHtml : lblHtml}
            </div>
            <div class="item-dot-row">
              <div class="timeline-dot"></div>
            </div>
            <div class="item-bottom">
              ${isAbove ? lblHtml : fanHtml}
            </div>`;
        } else {
          // ── Mobile: dot + inline content ──
          item.style.position = 'relative';
          item.innerHTML = `
            <div class="item-dot-row">
              <div class="timeline-dot"></div>
            </div>
            <div class="item-mobile-content">
              <div class="mobile-label-name">${mem.title}</div>
              <div class="mobile-label-meta">🗓 ${mem.date} &nbsp;·&nbsp; 📍 ${mem.location}</div>
              <div class="mobile-fan">
                ${mem.images.map(item => isVideo(item)
                  ? `<div class="thumb-video-wrap">${item.thumb ? `<img src="${item.thumb}" class="mobile-thumb" alt="" />` : ''}<div class="thumb-video-icon">▶</div></div>`
                  : `<img src="${item}" class="mobile-thumb" alt="" />`
                ).join('')}
              </div>
            </div>`;
        }

        track.appendChild(item);
      });

      setTimeout(() => { updateTimelineArrows(); positionTimelineArrows(); }, 50);
    }

    function buildFan(images, extraClass) {
      return `<div class="fan-wrap ${extraClass}">
        ${images.map(item => isVideo(item)
          ? `<div class="fan-card">${item.thumb ? `<img src="${item.thumb}" alt="" />` : ''}<div class="fan-video-icon">▶</div></div>`
          : `<div class="fan-card"><img src="${item}" alt="" /></div>`
        ).join('')}
      </div>`;
    }

    function buildLabel(mem) {
      return `<div class="memory-label">
        <div class="memory-label-date">${mem.date}</div>
        <div class="memory-label-name">${mem.title}</div>
        <div class="memory-label-loc">📍 ${mem.location}</div>
      </div>`;
    }

    // Re-render on resize (debounced)
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderTimeline, 150);
    });

    // Initial render (from localStorage cache)
    renderTimeline();
    // Migrate hardcoded memories once, then sync from Firestore
    syncFromFirestore();

    // ── Timeline arrow navigation (transform-based, no overflow clipping) ──
    function scrollTimeline(dir) {
      const nav   = document.querySelector('.timeline-section');
      const track = document.getElementById('timelineTrack');
      const max   = Math.max(0, track.scrollWidth - nav.clientWidth);
      tlOffset = Math.max(0, Math.min(max, tlOffset + dir * 260));
      track.style.transform = `translateX(-${tlOffset}px)`;
      updateTimelineArrows();
    }

    function updateTimelineArrows() {
      const nav   = document.querySelector('.timeline-section');
      const track = document.getElementById('timelineTrack');
      if (!nav || !track) return;
      const max = Math.max(0, track.scrollWidth - nav.clientWidth);
      document.getElementById('timelinePrev').disabled = tlOffset <= 0;
      document.getElementById('timelineNext').disabled = tlOffset >= max;
    }

    function positionTimelineArrows() {
      if (isMobile()) return;
      const track = document.getElementById('timelineTrack');
      if (!track) return;
      const rect = track.getBoundingClientRect();
      const lineTop = rect.top + 230 + 9; // --half-h (230px) + dot offset (9px)
      document.getElementById('timelinePrev').style.top = lineTop + 'px';
      document.getElementById('timelineNext').style.top = lineTop + 'px';
    }

    window.addEventListener('scroll', positionTimelineArrows);
    window.addEventListener('resize', positionTimelineArrows);

    updateTimelineArrows();

    // ══════════════════════════════════════════
    // DETAIL MODAL + VIEWER
    // ══════════════════════════════════════════
    let viewerImages = [];
    let viewerIndex  = 0;
    let currentMemory = null;

    function openDetail(mem) {
      currentMemory = mem;
      viewerImages = mem.images;

      document.getElementById('detailTitle').textContent    = mem.title;
      document.getElementById('detailDate').textContent     = '🗓 ' + mem.date;
      document.getElementById('detailLocation').textContent = '📍 ' + mem.location;

      const descEl = document.getElementById('detailDesc');
      descEl.textContent   = mem.description || '';
      descEl.style.display = mem.description ? 'block' : 'none';

      const createdByEl = document.getElementById('detailCreatedBy');
      createdByEl.textContent = mem.createdBy ? 'Aangemaakt door ' + mem.createdBy : '';

      const hasPhotos = mem.images && mem.images.length > 0;

      // Show/hide placeholder vs photo sections
      document.getElementById('noPhotosPlaceholder').style.display = hasPhotos ? 'none' : '';
      document.querySelector('.detail-viewer').style.display        = hasPhotos ? ''     : 'none';
      document.querySelector('.detail-thumbs-wrap').style.display   = 'none'; // always hidden by design
      document.querySelector('.detail-all-heading').style.display   = hasPhotos ? ''     : 'none';
      document.querySelector('.detail-all-grid').style.display      = hasPhotos ? ''     : 'none';

      if (hasPhotos) {
        // Build thumbnail strip
        document.getElementById('detailThumbs').innerHTML = mem.images.map((item, i) =>
          `<div class="detail-thumb" onclick="viewerGoTo(${i})">
             ${isVideo(item) ? (item.thumb ? `<img src="${item.thumb}" alt="" />` : '') : `<img src="${item}" alt="" />`}
             ${isVideo(item) ? '<div class="thumb-video-icon">▶</div>' : ''}
           </div>`
        ).join('');

        // Build all-photos grid
        document.getElementById('detailAllPhotos').innerHTML = mem.images.map((item, i) =>
          `<div class="detail-all-photo" onclick="viewerGoTo(${i}); this.closest('.detail-box').scrollTop = 0;">
             ${isVideo(item) ? (item.thumb ? `<img src="${item.thumb}" alt="" />` : '') : `<img src="${item}" alt="" />`}
             ${isVideo(item) ? '<div class="thumb-video-icon">▶</div>' : ''}
           </div>`
        ).join('');

        viewerShow(0, false);
      }

      document.getElementById('detailModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function viewerShow(i, animate) {
      viewerIndex = i;
      const imgEl   = document.getElementById('viewerImg');
      const videoEl = document.getElementById('viewerVideo');
      const item    = viewerImages[i];

      videoEl.pause();
      videoEl.removeAttribute('src');

      if (isVideo(item)) {
        imgEl.style.display   = 'none';
        videoEl.style.display = 'block';
        videoEl.src           = item.url;
        videoEl.load();
      } else {
        videoEl.style.display = 'none';
        imgEl.style.display   = 'block';
        if (animate) {
          imgEl.classList.add('fading');
          setTimeout(() => { imgEl.src = item; imgEl.classList.remove('fading'); }, 160);
        } else {
          imgEl.src = item;
        }
      }

      document.getElementById('viewerCounter').textContent = (i + 1) + ' / ' + viewerImages.length;
      document.getElementById('viewerPrev').disabled = (i === 0);
      document.getElementById('viewerNext').disabled = (i === viewerImages.length - 1);

      // Highlight active thumb + all-photos grid item
      document.querySelectorAll('.detail-thumb').forEach((t, ti) =>
        t.classList.toggle('active', ti === i)
      );
      document.querySelectorAll('.detail-all-photo').forEach((t, ti) =>
        t.classList.toggle('active', ti === i)
      );
      // Scroll active thumb into view
      const strip = document.getElementById('detailThumbs');
      if (strip.children[i])
        strip.children[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function viewerGoTo(i) { viewerShow(i, true); }
    function viewerStep(dir) {
      const n = viewerIndex + dir;
      if (n >= 0 && n < viewerImages.length) viewerShow(n, true);
    }

    function closeDetail() {
      const videoEl = document.getElementById('viewerVideo');
      videoEl.pause();
      videoEl.removeAttribute('src');
      document.getElementById('detailModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    // Keyboard: arrows + Escape inside modal
    document.addEventListener('keydown', e => {
      if (!document.getElementById('detailModal').classList.contains('open')) return;
      if (e.key === 'ArrowLeft')  viewerStep(-1);
      if (e.key === 'ArrowRight') viewerStep(1);
      if (e.key === 'Escape')     closeDetail();
    });

    // Touch swipe on modal (mobile)
    let _tx = 0;
    document.getElementById('detailModal').addEventListener('touchstart', e => {
      _tx = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('detailModal').addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - _tx;
      if (Math.abs(dx) > 48) viewerStep(dx < 0 ? 1 : -1);
    });

    document.getElementById('detailModal').addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });

    // ── Toast ──
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2800);
    }

    // ══════════════════════════════════════════
    // ADD / EDIT MEMORY
    // ══════════════════════════════════════════
    const DUTCH_MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
    let addDateType     = 'day';
    let stagedPhotos    = [];
    let editingMemoryId = null;
    let formDirty       = false;

    function openAddModal(memToEdit = null) {
      editingMemoryId = memToEdit ? memToEdit.id : null;
      formDirty = false;

      const titleEl  = document.getElementById('addModalTitle');
      const submitEl = document.getElementById('addSubmitBtn');
      const deleteEl = document.getElementById('deleteMemBtn');

      if (memToEdit) {
        document.getElementById('addTitle').value    = memToEdit.title;
        document.getElementById('addLocation').value = memToEdit.location;
        document.getElementById('addFormDesc').value = memToEdit.description || '';
        const dtype = memToEdit.dateType ||
          (/^\d{4}-\d{2}-\d{2}$/.test(memToEdit.sortDate || '') ? 'day' : 'month');
        if (dtype === 'day') {
          setDateType('day');
          document.getElementById('addDateDay').value = memToEdit.sortDate || '';
        } else {
          setDateType('month');
          document.getElementById('addDateMonth').value = (memToEdit.sortDate || '').substring(0, 7);
        }
        stagedPhotos         = [...(memToEdit.images || [])];
        titleEl.textContent  = '✏️ Herinnering bewerken';
        submitEl.textContent = 'Wijzigingen opslaan ✓';
        submitEl.disabled    = true;
        deleteEl.style.display = '';
      } else {
        document.getElementById('addTitle').value     = '';
        document.getElementById('addLocation').value  = '';
        document.getElementById('addFormDesc').value  = '';
        document.getElementById('addDateDay').value   = '';
        document.getElementById('addDateMonth').value = '';
        stagedPhotos         = [];
        setDateType('day');
        titleEl.textContent  = '✨ Herinnering toevoegen';
        submitEl.textContent = 'Opslaan ✓';
        submitEl.disabled    = false;
        deleteEl.style.display = 'none';
      }

      renderPhotoPreviews();
      document.getElementById('addError').style.display = 'none';
      document.getElementById('addModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openEditModal() {
      if (currentMemory) openAddModal(currentMemory);
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function markDirty() {
      if (editingMemoryId === null || formDirty) return;
      formDirty = true;
      document.getElementById('addSubmitBtn').disabled = false;
    }

    function setDateType(type) {
      addDateType = type;
      document.querySelectorAll('.date-type-btn').forEach((btn, i) =>
        btn.classList.toggle('active', (i === 0) === (type === 'day'))
      );
      document.getElementById('addDateDay').style.display   = type === 'day'   ? '' : 'none';
      document.getElementById('addDateMonth').style.display = type === 'month' ? '' : 'none';
    }

    async function handleFiles(input) {
      const submitBtn = document.getElementById('addSubmitBtn');
      for (const file of input.files) {
        if (file.type.startsWith('video/')) {
          const origText = submitBtn.textContent;
          submitBtn.disabled    = true;
          submitBtn.textContent = 'Miniatuur maken...';
          try {
            const thumb = await captureVideoThumb(file);
            submitBtn.textContent = 'Video uploaden... 0%';
            const url = await uploadToR2(file, pct => {
              submitBtn.textContent = `Video uploaden... ${pct}%`;
            });
            stagedPhotos.push({ type: 'video', url, thumb });
          } catch(e) {
            showToast('Video uploaden mislukt: ' + e.message);
          }
          submitBtn.textContent = origText;
          submitBtn.disabled    = (editingMemoryId !== null && !formDirty);
        } else {
          const compressed = await compressImage(file);
          stagedPhotos.push(compressed);
        }
      }
      renderPhotoPreviews();
      markDirty();
      input.value = '';
    }

    function compressImage(file, maxWidth = 1200, quality = 0.82) {
      return new Promise(resolve => {
        // SVGs are vector — skip rasterisation, return as-is
        if (file.type === 'image/svg+xml') {
          const reader = new FileReader();
          reader.onload = e => resolve(e.target.result);
          reader.readAsDataURL(file);
          return;
        }
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPhotoPreviews() {
      document.getElementById('photoPreviews').innerHTML = stagedPhotos.map((item, i) => {
        const inner = isVideo(item)
          ? `${item.thumb ? `<img src="${item.thumb}" alt="" style="object-fit:cover;width:80px;height:80px;border-radius:6px;" />` : ''}<div class="fan-video-icon" style="width:24px;height:24px;font-size:0.7rem;">▶</div>`
          : `<img src="${item}" alt="" />`;
        return `<div class="preview-item">${inner}<button class="preview-remove" onclick="removePhoto(${i})">✕</button></div>`;
      }).join('');
    }

    function removePhoto(i) {
      stagedPhotos.splice(i, 1);
      renderPhotoPreviews();
      markDirty();
    }

    function formatDisplayDate(value, type) {
      if (!value) return '';
      if (type === 'day') {
        const [y, m, d] = value.split('-');
        return `${parseInt(d)} ${DUTCH_MONTHS[parseInt(m) - 1]} ${y}`;
      } else {
        const [y, m] = value.split('-');
        return `${DUTCH_MONTHS[parseInt(m) - 1]} ${y}`;
      }
    }

    async function confirmDeleteMemory() {
      if (!confirm('Weet je zeker dat je deze herinnering wilt verwijderen?')) return;
      const mem = getAllMemories().find(m => m.id === editingMemoryId);
      if (mem && mem.firestoreId) {
        await deleteFromFirestore(mem.firestoreId);
      }
      closeAddModal();
      closeDetail();
      renderTimeline();
      showToast('Herinnering verwijderd.');
    }

    async function submitMemory() {
      const title    = document.getElementById('addTitle').value.trim();
      const location = document.getElementById('addLocation').value.trim();
      const dateVal  = addDateType === 'day'
        ? document.getElementById('addDateDay').value
        : document.getElementById('addDateMonth').value;
      const desc  = document.getElementById('addFormDesc').value.trim();
      const errEl = document.getElementById('addError');

      if (!title)    { errEl.textContent = 'Vul een titel in.';   errEl.style.display = 'block'; return; }
      if (!dateVal)  { errEl.textContent = 'Vul een datum in.';   errEl.style.display = 'block'; return; }
      if (!location) { errEl.textContent = 'Vul een locatie in.'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';

      const submitBtn = document.getElementById('addSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Opslaan... ⏳';

      const memData = {
        title,
        date:        formatDisplayDate(dateVal, addDateType),
        sortDate:    addDateType === 'day' ? dateVal : dateVal + '-01',
        dateType:    addDateType,
        location,
        description: desc || null,
        images:      [...stagedPhotos],
      };

      try {
        if (editingMemoryId !== null) {
          // Update in Firestore
          const mem = getAllMemories().find(m => m.id === editingMemoryId);
          if (mem && mem.firestoreId) {
            await saveMemoryToFirestore(memData, mem.firestoreId);
            const idx = memoriesCache.findIndex(m => m.firestoreId === mem.firestoreId);
            if (idx !== -1) memoriesCache[idx] = { ...memoriesCache[idx], ...memData };
            saveCache();
          }
          closeAddModal();
          closeDetail();
          renderTimeline();
          showToast('Herinnering bijgewerkt! ✓');
        } else {
          // Nieuwe herinnering: opslaan in Firestore
          const firestoreId = await saveMemoryToFirestore(memData);
          const newMem = { id: 'fb_' + firestoreId, firestoreId, ...memData };
          memoriesCache.push(newMem);
          saveCache();
          closeAddModal();
          renderTimeline();
          showToast('Herinnering opgeslagen! 🎉');
        }
      } catch(e) {
        console.error('Opslaan mislukt:', e);
        errEl.textContent = 'Opslaan mislukt: ' + (e.message || e.code || JSON.stringify(e));
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = editingMemoryId !== null ? 'Wijzigingen opslaan ✓' : 'Opslaan ✓';
      }
    }

    // Close add modal on backdrop click
    document.getElementById('addModal').addEventListener('click', function(e) {
      if (e.target === this) closeAddModal();
    });

    // ══════════════════════════════════════════
    // SPOTIFY – herstart speler met opgeslagen token
    // ══════════════════════════════════════════
    (function initSpotify() {
      const token  = sessionStorage.getItem('sp_token');
      const expiry = parseInt(sessionStorage.getItem('sp_expiry') || '0');
      if (!token || Date.now() >= expiry) return; // geen geldige token

      // Toon opgeslagen track-info meteen, vóór SDK verbindt
      const savedInit = JSON.parse(sessionStorage.getItem('sp_track') || 'null');
      if (savedInit && savedInit.name) {
        document.getElementById('trackName').textContent  = savedInit.name;
        document.getElementById('artistName').textContent = savedInit.artist || '';
        if (savedInit.art) document.getElementById('albumArt').src = savedInit.art;
        document.getElementById('miniPlayer').style.display = 'flex';
      }

      const PLAYLIST_URI = 'spotify:playlist:37i9dQZF1EJwmwHt8uQefo';
      let spotifyPlayer = null;
      let progressTimer = null;
      let currentPosition = 0;
      let currentDuration = 1;

      function updateProgress(pos, dur) {
        document.getElementById('progressBar').style.width = (dur > 0 ? (pos / dur) * 100 : 0) + '%';
      }
      function togglePlay() { if (spotifyPlayer) spotifyPlayer.togglePlay(); }
      function skipNext()   { if (spotifyPlayer) spotifyPlayer.nextTrack(); }
      function skipPrev()   { if (spotifyPlayer) spotifyPlayer.previousTrack(); }
      window.togglePlay = togglePlay;
      window.skipNext   = skipNext;
      window.skipPrev   = skipPrev;

      const start = () => {
        spotifyPlayer = new Spotify.Player({
          name: 'Onze Herinneringen 💛',
          getOAuthToken: cb => cb(token),
          volume: 0.65
        });

        spotifyPlayer.addListener('ready', ({ device_id }) => {
          const saved = JSON.parse(sessionStorage.getItem('sp_track') || 'null');
          const body = saved
            ? { context_uri: PLAYLIST_URI, offset: { uri: saved.uri }, position_ms: saved.position }
            : { context_uri: PLAYLIST_URI };

          fetch('https://api.spotify.com/v1/me/player/play?device_id=' + device_id, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          }).then(() => {
            document.getElementById('miniPlayer').style.display = 'flex';
            // Was gepauzeerd? Dan ook hier pauzeren na korte delay
            if (saved && saved.paused) setTimeout(() => spotifyPlayer.pause(), 800);
          });
        });

        spotifyPlayer.addListener('player_state_changed', state => {
          if (!state) return;
          const track = state.track_window.current_track;
          currentPosition = state.position;
          currentDuration = state.duration;
          document.getElementById('trackName').textContent    = track.name;
          document.getElementById('artistName').textContent   = track.artists.map(a => a.name).join(', ');
          document.getElementById('playPauseBtn').textContent = state.paused ? '▶' : '⏸';
          const img = track.album.images[0];
          if (img) document.getElementById('albumArt').src = img.url;
          sessionStorage.setItem('sp_track', JSON.stringify({
            uri: track.uri, position: state.position, paused: state.paused,
            name: track.name,
            artist: track.artists.map(a => a.name).join(', '),
            art: track.album.images[0] ? track.album.images[0].url : ''
          }));
          updateProgress(currentPosition, currentDuration);
          clearInterval(progressTimer);
          if (!state.paused) {
            progressTimer = setInterval(() => {
              currentPosition = Math.min(currentPosition + 1000, currentDuration);
              updateProgress(currentPosition, currentDuration);
              sessionStorage.setItem('sp_track', JSON.stringify({
                uri: track.uri, position: currentPosition, paused: false,
                name: track.name,
                artist: track.artists.map(a => a.name).join(', '),
                art: track.album.images[0] ? track.album.images[0].url : ''
              }));
            }, 1000);
          }
        });

        spotifyPlayer.addListener('not_ready', () => clearInterval(progressTimer));
        spotifyPlayer.connect();
      };

      if (window.Spotify) start();
      else window.onSpotifyWebPlaybackSDKReady = start;
    })();
  </script>
