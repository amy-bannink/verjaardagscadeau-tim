<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog – Onze Herinneringen</title>
  <link rel="stylesheet" href="styles/shared.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/backlog.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="window.location.href='./dashboard.html'"><span class="back-btn-arrow">← </span>Terug</button>
      <span class="topbar-title">Backlog</span>
    </div>
    <div class="topbar-right">
      <div class="user-menu">
        <button class="user-badge" id="userBadge" onclick="toggleUserMenu()">👤 ...</button>
        <div class="user-dropdown" id="userDropdown">
          <button onclick="doLogout()">Uitloggen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <h1>Backlog</h1>
      <p>Jullie persoonlijke sprint planning — dingen die we nog willen doen.</p>
    </div>

    <div class="status-tabs" id="statusTabs">
      <button class="status-tab active" data-status="all">Alle</button>
      <button class="status-tab" data-status="backlog">📋 Backlog</button>
      <button class="status-tab" data-status="sprint">🏃 In Sprint</button>
      <button class="status-tab" data-status="done">✅ Gedaan</button>
    </div>

    <button class="add-btn" onclick="openAddModal()">+ Ticket toevoegen</button>

    <div class="items-list" id="itemsList">
      <div class="items-loading">Laden...</div>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div id="addModal">
    <div class="add-box">
      <button class="detail-close" onclick="closeAddModal()">✕</button>
      <h2 id="modalTitle">✨ Ticket toevoegen</h2>
      <div class="form-error" id="addError"></div>

      <div class="form-group">
        <label for="addEmoji">Emoji <span class="optional">(optioneel)</span></label>
        <input type="text" class="form-input emoji-input" id="addEmoji"
               placeholder="🎯" maxlength="4" />
      </div>

      <div class="form-group">
        <label for="addTitle">Titel *</label>
        <input type="text" class="form-input" id="addTitle"
               placeholder="bijv. Weekendje Parijs" maxlength="100" />
      </div>

      <div class="form-group">
        <label for="addDesc">Beschrijving <span class="optional">(optioneel)</span></label>
        <textarea class="form-input" id="addDesc" rows="3"
                  placeholder="Vertel er iets meer over..."></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>
        <div class="status-picker" id="statusPicker">
          <button class="status-pick-btn active" data-val="backlog">📋 Backlog</button>
          <button class="status-pick-btn" data-val="sprint">🏃 In Sprint</button>
          <button class="status-pick-btn" data-val="done">✅ Gedaan</button>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-delete" id="deleteBtn" onclick="confirmDelete()" style="display:none">
          <span class="btn-delete-icon">🗑 </span>Verwijderen
        </button>
        <button class="btn-cancel" onclick="closeAddModal()">Annuleren</button>
        <button class="btn-submit" id="submitBtn" onclick="submitItem()">Opslaan ✓</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── Session guard ──
    const session = JSON.parse(localStorage.getItem('app_session') || 'null');
    if (!session || Date.now() - session.loginAt > 30 * 24 * 60 * 60 * 1000) {
      window.location.replace('./index.html');
    } else {
      document.getElementById('userBadge').textContent = '👤 ' + session.name;
    }

    function doLogout() {
      localStorage.removeItem('app_session');
      window.location.href = './index.html';
    }
    function toggleUserMenu() {
      document.getElementById('userDropdown').classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const menu  = document.getElementById('userDropdown');
      const badge = document.getElementById('userBadge');
      if (!badge.contains(e.target) && !menu.contains(e.target))
        menu.classList.remove('open');
    });

    // ── Firebase ──
    const firebaseConfig = {
      apiKey:            "AIzaSyDfLpYTRYxM3FAIiRoBUe21TZ7-vS0K1jg",
      authDomain:        "herinneringen-webapp.firebaseapp.com",
      projectId:         "herinneringen-webapp",
      storageBucket:     "herinneringen-webapp.firebasestorage.app",
      messagingSenderId: "331175860752",
      appId:             "1:331175860752:web:794ee8ae902e3a971e0895"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── State ──
    let items       = [];
    let activeTab   = 'all';
    let editingId   = null;
    let selStatus   = 'backlog';

    const STATUS_LABEL = { backlog: '📋 Backlog', sprint: '🏃 In Sprint', done: '✅ Gedaan' };
    const STATUS_CLASS = { backlog: 'badge-backlog', sprint: 'badge-sprint', done: 'badge-done' };

    // ── Firestore ──
    async function loadItems() {
      try {
        const snap = await db.collection('backlog_items')
          .orderBy('createdAt', 'desc').get();
        items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      } catch(e) {
        document.getElementById('itemsList').innerHTML =
          `<div class="items-empty">Laden mislukt: ${e.message}</div>`;
      }
    }

    async function saveItem(data, id = null) {
      const ts = firebase.firestore.FieldValue.serverTimestamp();
      if (id) {
        await db.collection('backlog_items').doc(id).update({ ...data, updatedAt: ts });
      } else {
        await db.collection('backlog_items').add({
          ...data, createdBy: session.name, createdAt: ts, updatedAt: ts
        });
      }
    }

    // ── Tabs ──
    document.getElementById('statusTabs').addEventListener('click', e => {
      const btn = e.target.closest('.status-tab');
      if (!btn) return;
      document.querySelectorAll('.status-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.status;
      render();
    });

    // ── Status picker (modal) ──
    document.getElementById('statusPicker').addEventListener('click', e => {
      const btn = e.target.closest('.status-pick-btn');
      if (!btn) return;
      document.querySelectorAll('.status-pick-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selStatus = btn.dataset.val;
    });

    // ── Render ──
    function escHtml(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      // Tab counts
      document.querySelectorAll('.status-tab').forEach(tab => {
        const s     = tab.dataset.status;
        const count = s === 'all' ? items.length : items.filter(i => i.status === s).length;
        const base  = tab.dataset.label || tab.textContent.replace(/\s*\(\d+\)\s*$/, '').trim();
        tab.dataset.label = base;
        tab.textContent   = count > 0 ? `${base} (${count})` : base;
        if (tab.classList.contains('active')) tab.textContent = tab.textContent; // keep active style
      });

      const filtered = activeTab === 'all'
        ? items
        : items.filter(i => i.status === activeTab);

      const list = document.getElementById('itemsList');

      if (filtered.length === 0) {
        const msgs = {
          all:     'Nog geen tickets. Voeg je eerste toe!',
          backlog: 'Geen tickets in de backlog.',
          sprint:  'Niets in sprint — tijd voor een refinement? 😄',
          done:    'Nog niets afgerond. Kom op! 🚀',
        };
        list.innerHTML = `<div class="items-empty">${msgs[activeTab] || 'Geen tickets.'}</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => `
        <div class="item-card" onclick="openEditModal('${item.id}')">
          <div class="item-emoji">${escHtml(item.emoji || '🎯')}</div>
          <div class="item-body">
            <div class="item-title">${escHtml(item.title)}</div>
            ${item.description
              ? `<div class="item-desc">${escHtml(item.description)}</div>`
              : ''}
            <div class="item-meta">
              <span class="item-badge ${STATUS_CLASS[item.status] || ''}">
                ${STATUS_LABEL[item.status] || item.status}
              </span>
              <span class="item-by">${escHtml(item.createdBy || '')}</span>
            </div>
          </div>
          <div class="item-arrow">›</div>
        </div>
      `).join('');
    }

    // ── Modal ──
    function openAddModal(itemId = null) {
      editingId = itemId;
      const item = itemId ? items.find(i => i.id === itemId) : null;

      document.getElementById('modalTitle').textContent =
        item ? '✏️ Ticket bewerken' : '✨ Ticket toevoegen';
      document.getElementById('addEmoji').value = item?.emoji   || '';
      document.getElementById('addTitle').value = item?.title   || '';
      document.getElementById('addDesc').value  = item?.description || '';
      document.getElementById('addError').style.display = 'none';
      document.getElementById('deleteBtn').style.display = item ? '' : 'none';

      selStatus = item?.status || 'backlog';
      document.querySelectorAll('.status-pick-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.val === selStatus)
      );

      document.getElementById('addModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('addTitle').focus(), 80);
    }

    function openEditModal(id) { openAddModal(id); }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('addModal').addEventListener('click', function(e) {
      if (e.target === this) closeAddModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('addModal').classList.contains('open'))
        closeAddModal();
    });

    async function submitItem() {
      const title = document.getElementById('addTitle').value.trim();
      const errEl = document.getElementById('addError');
      if (!title) {
        errEl.textContent = 'Vul een titel in.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled    = true;
      btn.textContent = 'Opslaan... ⏳';

      const data = {
        emoji:       document.getElementById('addEmoji').value.trim() || null,
        title,
        description: document.getElementById('addDesc').value.trim() || null,
        status:      selStatus,
      };

      try {
        await saveItem(data, editingId);
        await loadItems();
        closeAddModal();
        showToast(editingId ? 'Ticket bijgewerkt! ✓' : 'Ticket toegevoegd! 🎉');
      } catch(e) {
        errEl.textContent = 'Opslaan mislukt: ' + e.message;
        errEl.style.display = 'block';
      }

      btn.disabled    = false;
      btn.textContent = 'Opslaan ✓';
    }

    async function confirmDelete() {
      if (!confirm('Weet je zeker dat je dit ticket wilt verwijderen?')) return;
      try {
        await db.collection('backlog_items').doc(editingId).delete();
        items = items.filter(i => i.id !== editingId);
        render();
        closeAddModal();
        showToast('Ticket verwijderd.');
      } catch(e) {
        showToast('Verwijderen mislukt: ' + e.message);
      }
    }

    // ── Toast ──
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent   = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2800);
    }

    loadItems();
  </script>
</body>
</html>
