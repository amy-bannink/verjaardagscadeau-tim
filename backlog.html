<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog – Onze Herinneringen</title>
  <link rel="stylesheet" href="styles/shared.css" />
  <link rel="stylesheet" href="styles/dashboard.css" />
  <link rel="stylesheet" href="styles/backlog.css" />
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="window.location.href='./index.html'"><span class="back-btn-arrow">← </span>Terug</button>
      <span class="topbar-title">Backlog</span>
    </div>
    <div class="topbar-right">
      <div class="user-menu">
        <button class="user-badge" id="userBadge" onclick="toggleUserMenu()">👤 ...</button>
        <div class="user-dropdown" id="userDropdown">
          <button onclick="window.location.href='./dashboard.html'"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 6.5A1.5 1.5 0 0 1 3.5 5h1.1L6 3h6l1.4 2h1.1A1.5 1.5 0 0 1 16 6.5v8A1.5 1.5 0 0 1 14.5 16h-11A1.5 1.5 0 0 1 2 14.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="9" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg> Onze herinneringen</button>
          <button class="danger" onclick="doLogout()">Uitloggen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-header">
      <h1>Backlog</h1>
      <p>Dingen die we samen nog willen doen. ✨</p>
    </div>

    <button class="add-btn" onclick="openAddModal()">+ Wens toevoegen</button>

    <div class="items-list" id="itemsList">
      <div class="items-loading">Laden...</div>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div id="addModal">
    <div class="add-box">
      <button class="detail-close" onclick="closeAddModal()" aria-label="Sluiten"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <h2 id="modalTitle"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" class="sparkle-icon" aria-hidden="true"><path d="M12 2C12.5 6.5 17.5 11.5 22 12C17.5 12.5 12.5 17.5 12 22C11.5 17.5 6.5 12.5 2 12C6.5 11.5 11.5 6.5 12 2Z"/></svg> Wens toevoegen</h2>
      <div class="form-error" id="addError"></div>

      <div class="form-group">
        <label>Icoon <span class="optional">(optioneel)</span></label>
        <div class="icon-picker" id="iconPicker"></div>
      </div>

      <div class="form-group">
        <label for="addTitle">Wens *</label>
        <input type="text" class="form-input" id="addTitle"
               placeholder="bijv. Weekendje Parijs" maxlength="100" />
      </div>

      <div class="form-group">
        <label for="addDesc">Beschrijving <span class="optional">(optioneel)</span></label>
        <textarea class="form-input" id="addDesc" rows="3"
                  placeholder="Vertel er iets meer over..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn-delete" id="deleteBtn" onclick="confirmDelete()" style="display:none">
          <span class="btn-delete-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4h12M5.5 4V3a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 4V13.5H12V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Verwijderen
        </button>
        <button class="btn-cancel" onclick="closeAddModal()">Annuleren</button>
        <button class="btn-submit" id="submitBtn" onclick="submitItem()">Opslaan ✓</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ── Session guard ──
    const session = JSON.parse(localStorage.getItem('app_session') || 'null');
    if (!session || Date.now() - session.loginAt > 30 * 24 * 60 * 60 * 1000) {
      window.location.replace('./index.html');
    } else {
      document.getElementById('userBadge').textContent = '👤 ' + session.name;
    }

    function doLogout() {
      localStorage.removeItem('app_session');
      window.location.href = './index.html';
    }

    // ── Icons ──
    const ICONS = {
      star:     `<svg viewBox="0 0 24 24" fill="none"><path d="M12 2L15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      travel:   `<svg viewBox="0 0 24 24" fill="none"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      food:     `<svg viewBox="0 0 24 24" fill="none"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      movie:    `<svg viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="2.5" stroke="currentColor" stroke-width="1.75"/><path d="M17 12l-8.5 5V7z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>`,
      music:    `<svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.75"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.75"/></svg>`,
      heart:    `<svg viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"/></svg>`,
      mountain: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 21L11 4l8 17H3z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 11l5 10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>`,
      home:     `<svg viewBox="0 0 24 24" fill="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 22V12h6v10" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      nature:   `<svg viewBox="0 0 24 24" fill="none"><path d="M17 8C8 10 5.9 16.17 3.82 19c1.63-3.55 4-7.12 7.89-10C8.06 7.11 10.5 4 17 8z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.82 19C6 14 8 11 12 8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>`,
      sport:    `<svg viewBox="0 0 24 24" fill="none"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    };
    const ICON_LABELS = {
      star: 'Wens', travel: 'Reizen', food: 'Eten', movie: 'Film', music: 'Muziek',
      heart: 'Liefde', mountain: 'Avontuur', home: 'Thuis', nature: 'Natuur', sport: 'Sport',
    };

    let selectedIcon = null;

    function buildIconPicker() {
      document.getElementById('iconPicker').innerHTML = Object.keys(ICONS).map(key =>
        `<button type="button" class="icon-pick-btn" data-icon="${key}" onclick="selectIcon('${key}')">
          ${ICONS[key]}<span class="icon-pick-label">${ICON_LABELS[key]}</span>
        </button>`
      ).join('');
    }

    function selectIcon(key) {
      selectedIcon = selectedIcon === key ? null : key;
      document.querySelectorAll('#iconPicker .icon-pick-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.icon === selectedIcon);
      });
    }

    function renderItemIcon(item) {
      if (item.icon && ICONS[item.icon]) return ICONS[item.icon];
      if (item.emoji) return escHtml(item.emoji);
      return ICONS.star;
    }
    function toggleUserMenu() {
      document.getElementById('userDropdown').classList.toggle('open');
    }
    document.addEventListener('click', e => {
      const menu  = document.getElementById('userDropdown');
      const badge = document.getElementById('userBadge');
      if (!badge.contains(e.target) && !menu.contains(e.target))
        menu.classList.remove('open');
    });

    // ── Firebase ──
    const firebaseConfig = {
      apiKey:            "AIzaSyDfLpYTRYxM3FAIiRoBUe21TZ7-vS0K1jg",
      authDomain:        "herinneringen-webapp.firebaseapp.com",
      projectId:         "herinneringen-webapp",
      storageBucket:     "herinneringen-webapp.firebasestorage.app",
      messagingSenderId: "331175860752",
      appId:             "1:331175860752:web:794ee8ae902e3a971e0895"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── State ──
    let items     = [];
    let editingId = null;

    // ── Firestore ──
    async function loadItems() {
      try {
        const snap = await db.collection('backlog_items')
          .orderBy('createdAt', 'asc').get();
        items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      } catch(e) {
        document.getElementById('itemsList').innerHTML =
          `<div class="items-empty">Laden mislukt: ${e.message}</div>`;
      }
    }

    async function toggleDone(id, current, event) {
      event.stopPropagation();
      await db.collection('backlog_items').doc(id).update({
        done: !current,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      const item = items.find(i => i.id === id);
      if (item) item.done = !current;
      render();
    }

    // ── Render ──
    function escHtml(s) {
      return String(s ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      const todo = items.filter(i => !i.done);
      const done = items.filter(i =>  i.done);
      const list = document.getElementById('itemsList');

      if (items.length === 0) {
        list.innerHTML = `<div class="items-empty">Nog geen wensen — voeg de eerste toe! 🌟</div>`;
        return;
      }

      const renderCard = item => `
        <div class="item-card ${item.done ? 'item-done' : ''}" onclick="openEditModal('${item.id}')">
          <button class="item-check ${item.done ? 'checked' : ''}"
                  onclick="toggleDone('${item.id}', ${!!item.done}, event)"
                  title="${item.done ? 'Markeer als nog te doen' : 'Markeer als gedaan'}">
            ${item.done ? '✓' : ''}
          </button>
          <div class="item-emoji">${renderItemIcon(item)}</div>
          <div class="item-body">
            <div class="item-title">${escHtml(item.title)}</div>
            ${item.description ? `<div class="item-desc">${escHtml(item.description)}</div>` : ''}
            <div class="item-by">${escHtml(item.createdBy || '')}</div>
          </div>
          <div class="item-arrow">›</div>
        </div>
      `;

      let html = todo.map(renderCard).join('');

      if (done.length > 0) {
        html += `<div class="done-divider">✅ Gedaan (${done.length})</div>`;
        html += done.map(renderCard).join('');
      }

      list.innerHTML = html;
    }

    // ── Modal ──
    function openAddModal(itemId = null) {
      editingId = itemId;
      const item = itemId ? items.find(i => i.id === itemId) : null;

      document.getElementById('modalTitle').innerHTML = item
        ? `<svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true"><path d="M10.6 2a1.77 1.77 0 1 1 2.5 2.5L4.7 12.8 1.3 13.8l.9-3.4Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Wens bewerken`
        : `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" class="sparkle-icon" aria-hidden="true"><path d="M12 2C12.5 6.5 17.5 11.5 22 12C17.5 12.5 12.5 17.5 12 22C11.5 17.5 6.5 12.5 2 12C6.5 11.5 11.5 6.5 12 2Z"/></svg> Wens toevoegen`;
      selectedIcon = item?.icon || null;
      document.querySelectorAll('#iconPicker .icon-pick-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.icon === selectedIcon);
      });
      document.getElementById('addTitle').value = item?.title       || '';
      document.getElementById('addDesc').value  = item?.description || '';
      document.getElementById('addError').style.display  = 'none';
      document.getElementById('deleteBtn').style.display = item ? '' : 'none';

      document.getElementById('addModal').classList.add('open');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('addTitle').focus(), 80);
    }

    function openEditModal(id) { openAddModal(id); }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('addModal').addEventListener('click', function(e) {
      if (e.target === this) closeAddModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('addModal').classList.contains('open'))
        closeAddModal();
    });

    async function submitItem() {
      const title = document.getElementById('addTitle').value.trim();
      const errEl = document.getElementById('addError');
      if (!title) {
        errEl.textContent = 'Vul een wens in.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';

      const btn = document.getElementById('submitBtn');
      btn.disabled    = true;
      btn.textContent = 'Opslaan... ⏳';

      const ts   = firebase.firestore.FieldValue.serverTimestamp();
      const data = {
        icon:        selectedIcon || null,
        title,
        description: document.getElementById('addDesc').value.trim() || null,
        updatedAt:   ts,
      };

      try {
        if (editingId) {
          await db.collection('backlog_items').doc(editingId).update(data);
          const idx = items.findIndex(i => i.id === editingId);
          if (idx !== -1) items[idx] = { ...items[idx], ...data };
        } else {
          const ref = await db.collection('backlog_items').add({
            ...data, done: false, createdBy: session.name, createdAt: ts
          });
          items.push({ id: ref.id, ...data, done: false, createdBy: session.name });
        }
        render();
        closeAddModal();
        showToast(editingId ? 'Wens bijgewerkt! ✓' : 'Wens toegevoegd! 🌟');
      } catch(e) {
        errEl.textContent = 'Opslaan mislukt: ' + e.message;
        errEl.style.display = 'block';
      }

      btn.disabled    = false;
      btn.textContent = 'Opslaan ✓';
    }

    async function confirmDelete() {
      if (!confirm('Weet je zeker dat je deze wens wilt verwijderen?')) return;
      try {
        await db.collection('backlog_items').doc(editingId).delete();
        items = items.filter(i => i.id !== editingId);
        render();
        closeAddModal();
        showToast('Wens verwijderd.');
      } catch(e) {
        showToast('Verwijderen mislukt: ' + e.message);
      }
    }

    // ── Toast ──
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent   = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 2800);
    }

    buildIconPicker();
    loadItems();
  </script>
</body>
</html>
